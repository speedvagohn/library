<!DOCTYPE html>
<html lang="en", xmlns:th="https://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Library</title>
</head>
<body>

<div th:each = "book : ${books}">
    <a th:href = "@{/{id}(id = ${book.getId()})}" th:text="|${book.getId()}: ${book.getTitle}, ${book.getAuthor()},
                  ${book.getPublishYear()}, ${book.getReadingStatus()}, ${book.getGenre()}|">
        book
    </a>
</div>

<br/>
<hr/>

<a href = "/library/newBook">Create new Book</a>
</body>
</html>
