<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Библиотека</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .add-button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 4px;
        }

        .search-form {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 5px;
        }

        .search-input {
            padding: 8px;
            width: 300px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .search-button {
            padding: 8px 16px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .action-buttons {
            white-space: nowrap;
        }

        .edit-button {
            background-color: #FF9800;
            color: white;
            padding: 5px 10px;
            text-decoration: none;
            border-radius: 4px;
            margin-right: 5px;
        }

        .delete-button {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .clear-link {
            margin-left: 10px;
            color: #666;
            text-decoration: none;
        }

        .book-link {
            color: #2196F3;
            text-decoration: none;
        }

        .book-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Моя библиотека</h1>
    <a th:href="@{/newBook}" class="add-button">➕ Добавить книгу</a>
</div>

<!-- Форма поиска -->
<div class="search-form">
    <form th:action="@{/}" method="get">
        <input type="text"
               name="search"
               class="search-input"
               placeholder="Поиск по названию или автору..."
               th:value="${searchTerm != null ? searchTerm : ''}" />
        <button type="submit" class="search-button">🔍 Найти</button>

        <!-- Кнопка "Очистить" показывается только при активном поиске -->
        <th:block th:if="${searchTerm != null}">
            <a th:href="@{/}" class="clear-link">Очистить поиск</a>
        </th:block>
    </form>
</div>

<!-- Таблица с книгами -->
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Название</th>
        <th>Автор</th>
        <th>Год</th>
        <th>Жанр</th>
        <th>Статус</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.id}"></td>
        <td>
            <a th:href="@{/{id}(id=${book.id})}"
               class="book-link"
               th:text="${book.title}"></a>
        </td>
        <td th:text="${book.author}"></td>
        <td th:text="${book.publishYear}"></td>
        <td th:text="${book.genre}"></td>
        <td th:text="${book.readingStatus}"></td>
        <td class="action-buttons">
            <a th:href="@{/{id}/edit(id=${book.id})}"
               class="edit-button">✏️ Редактировать</a>
            <form th:action="@{/{id}(id=${book.id})}"
                  method="post"
                  style="display:inline;">
                <input type="hidden" name="_method" value="DELETE" />
                <button type="submit"
                        class="delete-button"
                        onclick="return confirm('Удалить книгу?')">
                    🗑️ Удалить
                </button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<!-- Сообщение если нет книг -->
<th:block th:if="${books != null and books.empty}">
    <p style="color: #666; font-style: italic; margin-top: 20px;">
        <th:block th:if="${searchTerm != null}">
            Книги не найдены по запросу: "<span th:text="${searchTerm}"></span>"
        </th:block>
        <th:block th:if="${searchTerm == null}">
            В библиотеке пока нет книг
        </th:block>
    </p>
</th:block>

<!-- Информация о количестве -->
<p style="color: #666; margin-top: 20px;">
    <th:block th:if="${searchTerm == null}">
        Всего книг: <strong th:text="${books.size()}"></strong>
    </th:block>
    <th:block th:if="${searchTerm != null}">
        Найдено книг: <strong th:text="${books.size()}"></strong>
    </th:block>
</p>

</body>
</html>
