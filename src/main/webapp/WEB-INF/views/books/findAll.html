<!DOCTYPE html>
<html lang="en", xmlns:th="https://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Библиотека</title>
</head>
<body>

<div th:each = "book : ${books}">
    <a th:href = "@{/{id}(id = ${book.getId()})}" th:text="|${book.getId()}: ${book.getTitle}, ${book.getAutor()},
                  ${book.getPublishYear()}, ${book.getReadingStatus()}, ${book.getGenre()}|">
        book
    </a>
</div>

</body>
</html>
